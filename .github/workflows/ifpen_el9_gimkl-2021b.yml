name: IFPEN el9 gimkl/2021b

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ctest_options:
        description: 'Options CTest'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Répertoires du framework
  #BUILD_DIR: /__w/framework/framework/build
  #INSTALL_DIR: /__w/framework/framework/install
  #SOURCE_DIR: /__w/framework/framework/source
  #EXT_LIB_SUBDIR: extlib # /__w/framework/framework/build/dependencies
  BUILD_DIR: /tmp/framewok-build
  INSTALL_DIR: /tmp/framework-install
  SOURCE_DIR: "/__w/framework/framework/source-${{ github.run_id }}"
  # ccache
  CCACHE_COMPRESS: true
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_MAXSIZE: 5G
  #CCACHE_DIR: '/__w/framework/framework/ccache'
  CCACHE_DIR: '/tmp/framework-ccache'
  # CMake
  CM_BUILD_OPTS: "-j16"
  CM_BUILD_TYPE: Release
  CM_CCACHE_OPTS: "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
  # CTest
  CT_OPTS: "-j32 --test-load 192 --timeout 1200 --output-on-failure ${{ github.event.inputs.ctest_options }}"
  # Pour corriger les erreurs d'Intel MPI apparues en juillet 2023
  #I_MPI_SHM_LMT: shm
  # Pour corriger les erreurs d'Intel MPI apparues en 2025
  I_MPI_WAIT_MODE: 1
  I_MPI_PIN: 0
  # Pour supprimer le répertoire de sortie des tests afin de réduire l'utilisation du disque
  ARCANE_TEST_CLEANUP_AFTER_RUN: 1

jobs:

  build:
    name: build and test
    runs-on: [self-hosted, m-1]
    timeout-minutes: 150
    container:
      image: ghcr.io/arcaneframework/ifpen-arcenv-gimkl-2021b-el9:latest
      options: --user root  # Éviter de correspondre à l'UID de github dans le conteneur.
    strategy:
      fail-fast: false

    steps:

      # ccache

      - name: Récupère la date
        id: get-date
        shell: bash
        run: echo "NOW=$(/bin/date -u '+%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Restaure le cache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ifpen-el9-gimkl-2021b-${{ env.CM_BUILD_TYPE }}-${{ env.NOW }}-${{ github.run_number }}
          restore-keys: ifpen-el9-gimkl-2021b-${{ env.CM_BUILD_TYPE }}-

      # Installation

      - name: Téléchargement
        id: checkout
        if: |
          (success() || failure())
        uses: actions/checkout@v6
        with:
          path: ${{ env.SOURCE_DIR }}
          submodules: true

      - name: Informations sur les modules
        id: modules_information
        if: |
          (success() || failure()) &&
          steps.checkout.outcome == 'success'
        shell: bash
        run: module --terse list 2>&1 | sort

      - name: Configuration
        id: configure
        if: |
          (success() || failure()) &&
          steps.checkout.outcome == 'success'
        shell: bash
        run: cmake -S ${{ env.SOURCE_DIR }} -B ${{ env.BUILD_DIR }} -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} ${{ env.CM_CCACHE_OPTS }} -DCMAKE_BUILD_TYPE=${{ env.CM_BUILD_TYPE }} -DARCCORE_BUILD_MODE=Check -DREMOVE_UID_ON_DETACH=ON -DUSE_GTEST_DEATH_TEST=ON -DCMAKE_DISABLE_FIND_PACKAGE_Papi=ON -DALIEN_BUILD_COMPONENT=all -DALIEN_PLUGIN_HYPRE=ON -DALIEN_PLUGIN_PETSC=ON -DUSE_GRAPH_CONNECTIVITY_POLICY=ON -DARCANE_DISABLE_PERFCOUNTER_TESTS=ON

      - name: Construction
        id: build
        if: |
          (success() || failure()) &&
          steps.configure.outcome == 'success'
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} ${{ env.CM_BUILD_OPTS }}

      - name: Installation
        id: install
        if: |
          (success() || failure()) &&
          steps.build.outcome == 'success'
        shell: bash
        run: cmake --install ${{ env.BUILD_DIR }}

      - name: Test
        id: test
        if: |
          (success() || failure()) &&
          steps.build.outcome == 'success'
        shell: bash
        run: |
           # Force l'utilisation d'intel-mpi 2021.16
           chmod -R u+w ${EBROOTIMPI}
           mv ${EBROOTIMPI} ${EBROOTIMPI}.old
           ln -s /opt/intel-mpi ${EBROOTIMPI}
           ln -s latest ${EBROOTIMPI}/mpi/2021.4.0
           # Vérifie la version d'intel-mpi
           which mpiexec
           mpiexec --version
           # Exécute le test
           ctest --test-dir ${{ env.BUILD_DIR }} ${{ env.CT_OPTS }} -E '(.*synchronize.*8proc|loadbalance.*12proc|.*hts.*mpi-4|CompositeSpace)'

      - name: Télécharge l'artefact de test
        id: upload-test-artifact
        uses: actions/upload-artifact@v7
        if: |
          (success() || failure()) &&
          steps.test.outcome == 'failure'
        with:
          name: test-artifact
          path: ${{ env.BUILD_DIR }}/Testing
          retention-days: 1
          include-hidden-files: true

      - name: Sauvegarde le cache
        id: save-cache
        if: |
          (success() || failure()) &&
          steps.build.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key:  ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Nettoyage
        id: clean
        if: always()
        run: |
           rm -rf ${{ env.SOURCE_DIR }}
           ls -l /__w/framework/framework
